<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members Area - BootstrapMade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --primary-dark: #023b6d; }
    body { font-family: 'Roboto', sans-serif; background-color: rgba(236, 242, 250, 0.36); }
    .header-container { background: rgba(255, 255, 255, 0.9); border-radius: 50px; }
    .custom-dropdown-menu { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); border: none; padding: 1rem; min-width: 240px; }
  </style>
</head>
<body>

  <!-- Navbar Global -->
  <header class="fixed-top mt-3">
    <div class="container">
      <div class="header-container d-flex align-items-center justify-content-between px-4 py-2 border">
        <!-- Logo enlazado a home.html -->
        <a class="navbar-brand fw-bold fs-4" href="home.html" style="color: var(--primary-dark);">
          <i class="bi bi-bootstrap-fill me-2 text-info fs-3"></i> BootstrapMade
        </a>
        <div class="d-flex align-items-center gap-2">
          <input type="text" class="form-control rounded-pill d-none d-md-block" placeholder="Buscar..." style="width: 180px;">
          <div class="dropdown">
            <button class="btn btn-outline-secondary rounded-pill px-3 dropdown-toggle" type="button" data-bs-toggle="dropdown">Menú</button>
            <ul class="dropdown-menu dropdown-menu-end custom-dropdown-menu">
              <li><a class="dropdown-item" href="home.html"><i class="bi bi-house me-2"></i>Ir a Inicio</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="templates.html">Templates</a></li>
              <li><a class="dropdown-item" href="bootstrap-builder.html">Bootstrap Builder</a></li>
              <li><a class="dropdown-item" href="portfolio-builder.html">Portfolio Builder</a></li>
              <li><a class="dropdown-item" href="premium.html">Premium</a></li>
              <li><a class="dropdown-item" href="license.html">License</a></li>
              <li><a class="dropdown-item" href="contact.html">Contact</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-info fw-bold" href="members.html"><i class="bi bi-person me-2"></i>Members</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido Members -->
  <main class="container my-5 pt-5">
    <div class="row justify-content-center my-4">
      <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0 text-center">
          <div class="mb-3">
            <i class="bi bi-person-circle display-4 text-info"></i>
          </div>
          <h2 class="fw-bold h4 mb-3" style="color: var(--primary-dark);">Área de Miembros</h2>
          <p class="text-muted small">Inicia sesión para descargar tus archivos comprados y licencias premium.</p>

          <form class="text-start">
            <div class="mb-3">
              <label class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" placeholder="tu@email.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" placeholder="••••••••">
            </div>
            <button type="button" class="btn btn-info text-white w-100 fw-bold py-2 mb-3">Iniciar Sesión</button>
            <div class="text-center">
              <a href="#" class="small text-decoration-none d-block mb-2">¿Olvidaste tu contraseña?</a>
              <!-- Enlace conectado directamente a CrearUsuario.html -->
              <a href="CrearUsuario.html" class="small text-decoration-none fw-bold text-primary">Crear usuario</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
