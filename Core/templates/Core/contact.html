<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - BootstrapMade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --primary-dark: #023b6d; }
    body { font-family: 'Roboto', sans-serif; background-color: rgba(236, 242, 250, 0.36); }
    .header-container { background: rgba(255, 255, 255, 0.9); border-radius: 50px; }
    .custom-dropdown-menu { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); border: none; padding: 1rem; min-width: 240px; }
  </style>
</head>
<body>

  <!-- Navbar Global -->
  <header class="fixed-top mt-3">
    <div class="container">
      <div class="header-container d-flex align-items-center justify-content-between px-4 py-2 border">
        <!-- Logo enlazado a home.html -->
        <a class="navbar-brand fw-bold fs-4" href="home.html" style="color: var(--primary-dark);">
          <i class="bi bi-bootstrap-fill me-2 text-info fs-3"></i> BootstrapMade
        </a>
        <div class="d-flex align-items-center gap-2">
          <input type="text" class="form-control rounded-pill d-none d-md-block" placeholder="Buscar..." style="width: 180px;">
          <div class="dropdown">
            <button class="btn btn-outline-secondary rounded-pill px-3 dropdown-toggle" type="button" data-bs-toggle="dropdown">Menú</button>
            <ul class="dropdown-menu dropdown-menu-end custom-dropdown-menu">
              <li><a class="dropdown-item" href="home.html"><i class="bi bi-house me-2"></i>Ir a Inicio</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="templates.html">Templates</a></li>
              <li><a class="dropdown-item" href="bootstrap-builder.html">Bootstrap Builder</a></li>
              <li><a class="dropdown-item" href="portfolio-builder.html">Portfolio Builder</a></li>
              <li><a class="dropdown-item" href="premium.html">Premium</a></li>
              <li><a class="dropdown-item" href="license.html">License</a></li>
              <li><a class="dropdown-item fw-bold text-primary" href="contact.html">Contact</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-info fw-bold" href="members.html"><i class="bi bi-person me-2"></i>Members</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido Contact -->
  <main class="container my-5 pt-5">
    <div class="text-center my-4">
      <h1 class="fw-bold" style="color: var(--primary-dark);"><i class="bi bi-envelope text-primary me-2"></i>Ponte en Contacto</h1>
      <p class="text-muted">¿Tienes alguna pregunta sobre nuestras plantillas o licencias? Escríbenos.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card p-4 shadow-sm border-0">
          <form>
            <div class="mb-3">
              <label class="form-label fw-medium">Nombre</label>
              <input type="text" class="form-control" placeholder="Tu nombre">
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium">Correo Electrónico</label>
              <input type="email" class="form-control" placeholder="tu@email.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium">Mensaje</label>
              <textarea class="form-control" rows="4" placeholder="¿En qué te podemos ayudar?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary rounded-pill w-100 py-2">Enviar Mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
